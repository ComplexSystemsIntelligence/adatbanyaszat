<script>
/* Magyar ábra- és táblázatfelirat-sorrend a HTML-kiadásban: "ábra 1.1." -> "1.1. ábra." */
document.addEventListener("DOMContentLoaded", function () {
  const re = /^(ábra|táblázat|algoritmus)\s+([0-9A-Z]+(?:\.[0-9]+)*)\.?\s*/i;
  document.querySelectorAll("figcaption, .figure-caption, caption, .quarto-float-caption").forEach(function (el) {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const t = w.nextNode();
    if (!t) return;
    const m = t.nodeValue.match(re);
    if (m) { t.nodeValue = t.nodeValue.replace(re, m[2] + ". " + m[1].toLowerCase() + ". "); }
  });
});
</script>
