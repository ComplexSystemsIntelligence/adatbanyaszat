<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TF-IDF és koszinusz-hasonlóság</title><link rel="stylesheet" href="common.css"><script src="common.js"></script></head><body>
<header><h1>TF-IDF és koszinusz-hasonlóság</h1><p>Írjon be saját dokumentumokat (soronként egyet), és vizsgálja meg a súlyokat és a dokumentumok hasonlóságát.</p></header>
<main>
<div class="controls">
  <label>Dokumentumok</label>
  <textarea id="tx" rows="8">a kávé friss és a kávé illatos
a tea friss
a szállítás lassú volt
a kávé szállítás gyors volt
illatos tea és friss kávé</textarea>
  <label>Stopszavak (vesszővel elválasztva)</label><input type="text" id="sw" value="a, az, és, volt" style="width:100%">
  <label>idf változat</label><select id="idf"><option value="cl">ln(N/df) – klasszikus</option><option value="sm">ln((1+N)/(1+df)) + 1 – scikit-learn</option></select>
  <label><input type="checkbox" id="nrm" checked> a dokumentumvektorok normálása</label>
  <div class="note">A cellák színe a súllyal, illetve a hasonlósággal arányos. A minden dokumentumban előforduló szó klasszikus idf-je nulla.</div>
</div>
<div class="panel"><div id="out"></div></div>
</main>
<script>
function run() { const sw = new Set(document.getElementById("sw").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean));
  const docs = document.getElementById("tx").value.split("\n").map(s => s.trim()).filter(Boolean), tok = docs.map(d => (d.toLowerCase().match(/[a-záéíóöőúüű0-9]+/g) || []).filter(w => !sw.has(w)));
  const voc = [...new Set(tok.flat())], N = docs.length, df = voc.map(w => tok.filter(t => t.includes(w)).length), sm = document.getElementById("idf").value === "sm";
  const idf = df.map(d => sm ? Math.log((1 + N) / (1 + d)) + 1 : Math.log(N / d));
  let W = tok.map(t => voc.map((w, j) => t.filter(x => x === w).length * idf[j]));
  if (document.getElementById("nrm").checked) W = W.map(r => { const n = Math.hypot(...r) || 1; return r.map(v => v / n); });
  const mx = Math.max(1e-9, ...W.flat()), cos = W.map(a => W.map(b => { const na = Math.hypot(...a), nb = Math.hypot(...b); return na && nb ? a.reduce((s, v, k) => s + v * b[k], 0) / (na * nb) : 0; }));
  let h = `<b>Dokumentum–szó mátrix (TF-IDF)</b><table class="t"><tr><th></th>${voc.map(w => `<th>${w}</th>`).join("")}</tr>` +
    W.map((r, i) => `<tr><th>d${i + 1}</th>${r.map(v => `<td style="background:${PE.heat(v / mx)};color:${v / mx > .6 ? "#fff" : "#1F2933"}">${v ? PE.fmt(v) : ""}</td>`).join("")}</tr>`).join("") +
    `<tr><th>idf</th>${idf.map(v => `<td style="color:#C8711E">${PE.fmt(v)}</td>`).join("")}</tr></table>`;
  h += `<b>Koszinusz-hasonlóság</b><table class="t"><tr><th></th>${docs.map((_, i) => `<th>d${i + 1}</th>`).join("")}</tr>` +
    cos.map((r, i) => `<tr><th>d${i + 1}</th>${r.map(v => `<td style="background:${PE.heat(v, [31, 144, 119])};color:${v > .6 ? "#fff" : "#1F2933"}">${PE.fmt(v)}</td>`).join("")}</tr>`).join("") + "</table>";
  document.getElementById("out").innerHTML = h; }
["tx", "sw"].forEach(id => document.getElementById(id).addEventListener("input", run)); ["idf", "nrm"].forEach(id => document.getElementById(id).addEventListener("change", run)); run();
</script></body></html>
